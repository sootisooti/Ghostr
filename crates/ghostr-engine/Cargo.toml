[package]
name = "ghostr-engine"
description = "Ghostr composition root: wiring, scheduling, job queue, and the local API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The only crate that knows which implementations are real. Nothing depends on
# this one (ARCHITECTURE §3 rule 5).
[dependencies]
ghostr-core = { workspace = true }
ghostr-crypto = { workspace = true }
ghostr-store = { workspace = true }
# The `nostr` feature is on here and nowhere else: the composition root is the
# only place that can hand a feed adapter a relay client, so enabling it in a
# lower crate would buy nothing and would put a transport dependency under code
# that has no business opening a socket.
ghostr-ingest = { workspace = true, features = ["nostr"] }
# The composition root is where a model gets wired in. No provider is on by
# default; `llm-local` turns Ollama on and `llm-remote` the gated providers.
ghostr-llm = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
ghostr-memoria = { workspace = true }
ghostr-persona = { workspace = true }
ghostr-quests = { workspace = true }
serde_json = { workspace = true }
ghostr-anchor = { workspace = true }
# The relay transport and the event codec. The composition root is where a
# vault's relays get wired in, and the only crate that may hold both a store
# and a network client.
ghostr-nostr = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
secp256k1 = { workspace = true }
# Drives the async model seam from synchronous `ops`. Optional and tied to
# `llm`: a stock build pulls no runtime at all, which is what keeps "works
# offline with no LLM" checkable with `cargo tree`. `rt` only — the providers
# speak blocking `ureq`, so there is no reactor to enable.
tokio = { workspace = true, features = ["rt"], optional = true }

[features]
default = []
## Wire a language model in. Off by default: a stock build has no model path,
## which makes "works offline with no LLM" checkable with `cargo tree`.
llm = ["dep:ghostr-llm", "dep:async-trait", "dep:tokio", "ghostr-memoria/llm"]
## A local Ollama-compatible runtime.
llm-local = ["llm", "ghostr-llm/local-ollama"]
## Remote providers, behind the egress gate. Off by default.
llm-remote = ["llm", "ghostr-llm/remote"]

[dev-dependencies]
# The relay double in `sync_restore` implements an async trait.
async-trait = { workspace = true }
ghostr-testkit = { workspace = true }
# Dev only, and already in the tree via `ghostr-anchor`. `anchor_upgrade` builds
# the two byte strings a real calendar exchange consists of — a pending proof and
# a Bitcoin attestation — so the upgrade path can be driven end to end without a
# network call (CLAUDE.md §4.8). Hand-rolling those bytes would be testing the
# fixture rather than the merge.
opentimestamps = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
