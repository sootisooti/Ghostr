[package]
name = "ghostr-nostr"
description = "Ghostr nostr relay client and event codec for kinds 31780-31789."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ghostr-core = { workspace = true }
ghostr-crypto = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The relay transport. Blocking, over `std::net::TcpStream`, matching every
# other I/O path in this tree rather than introducing an async reactor for a
# handful of connections (CLAUDE.md §4.9).
tungstenite = { workspace = true }
# Parsing the hex pubkey a NIP-46 signer reports. Already throughout the tree.
hex = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
chrono-tz = { workspace = true }
# The test relay: a real websocket server on loopback, so the transport is
# exercised against the protocol rather than against a mock of itself.
tungstenite = { workspace = true }
# The codec tests drive the real `FileKeystore` rather than a fake signer: a
# fake would happily agree with this codec's own mistakes about ECDH and NIP-44,
# which is the exact class of bug the crypto vectors exist to catch.
tempfile = { workspace = true }
# `SeededRng`, so the jitter tests are reproducible (CLAUDE.md §6).
ghostr-testkit = { workspace = true }
# Drives the async codec. `rt` + `macros` only: no reactor, no sockets.
tokio = { workspace = true, features = ["rt", "macros"] }
# The external-signer double needs a keypair of its own, to stand in for a key
# held outside this process. Already in the tree via ghostr-crypto.
secp256k1 = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
