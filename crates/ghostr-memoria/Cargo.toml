[package]
name = "ghostr-memoria"
description = "Ghostr daily compile pipeline: window, cluster, extract, compose, seal, anchor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ghostr-core = { workspace = true }
ghostr-store = { workspace = true }
ghostr-llm = { workspace = true, optional = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
# Only reachable behind the `llm` feature: the extraction schema is JSON.
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

[features]
default = []
## An LLM-backed Summarizer. Off in M0: with this feature disabled, `cargo tree`
## shows the binary has no model path at all, which makes "works offline with no
## LLM" a checkable property rather than a claim.
llm = ["dep:ghostr-llm", "dep:serde_json"]

[dev-dependencies]
ghostr-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
