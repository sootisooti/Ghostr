[package]
name = "ghostr-cli"
description = "The `gst` command-line interface for Ghostr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ghostr"
path = "src/main.rs"

[dependencies]
qrcode = { workspace = true }
ghostr-engine = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
ghostr-core = { workspace = true }
ghostr-crypto = { workspace = true }
ghostr-persona = { workspace = true }
ghostr-quests = { workspace = true }
ghostr-store = { workspace = true }
ghostr-anchor = { workspace = true }
# For the feed adapter's kind tag and its list of readable kinds, so `source
# add nostr` offers the same defaults the adapter enforces.
ghostr-ingest = { workspace = true, features = ["nostr"] }
ghostr-llm = { workspace = true, optional = true }
# The relay transport, for `sync` and `restore`. The CLI is a composition root:
# it is where a vault's configured relays become a client.
ghostr-nostr = { workspace = true }
# Drives the async relay calls to completion. `rt` only — every I/O path
# underneath is blocking, so there is no reactor to enable.
tokio = { workspace = true, features = ["rt"] }

[features]
default = []
## A local Ollama-compatible model.
llm-local = ["ghostr-engine/llm-local"]
## Remote providers, behind the egress gate. Off by default: a stock build
## cannot egress at all.
llm-remote = ["ghostr-engine/llm-remote", "dep:ghostr-llm", "ghostr-llm/remote"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
