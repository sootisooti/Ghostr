# cargo-deny configuration.
#
# This project is supply-chain sensitive: code running in-process holds the DEK
# (THREAT_MODEL §T8). The dependency tree is small on purpose, and every
# addition needs a justification in its PR (CLAUDE.md §4.9).

[advisories]
version = 2
# An unmaintained crate in this tree is a real finding, not noise.
yanked = "deny"

# Exceptions are listed individually with a reason, never blanket-disabled. Each
# one is a decision someone made and can be argued with.
ignore = [
    # rustls-pemfile is archived upstream: its PEM parsing moved into
    # rustls-pki-types, and the final release is a thin wrapper over it. Reached
    # transitively via ureq -> rustls-native-certs, which ghostr-anchor needs so
    # that OpenTimestamps submission works behind a TLS-inspecting proxy.
    #
    # Unmaintained, not vulnerable: no CVE, and the code is a few hundred lines
    # of PEM parsing that now lives in a maintained crate. Revisit when
    # rustls-native-certs drops the dependency, which is already in progress
    # upstream.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained, not vulnerable; transitive via ureq/rustls-native-certs" },
]

[licenses]
version = 2
# MIT-compatible only. A copyleft dependency would make the MIT promise on the
# tin false for anyone linking the result.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # A public-domain dedication — strictly more permissive than MIT, so it
    # cannot make the MIT promise on the tin false. Standard across the
    # rust-bitcoin ecosystem, which is where bip39 and bitcoin_hashes come from.
    "CC0-1.0",
    # Permissive data licence, no copyleft obligation on linked code. Carried by
    # a transitive data table.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Warn rather than deny: duplicate versions are usually a transitive pin someone
# else controls, and blocking a PR on it helps nobody.
multiple-versions = "warn"
wildcards = "deny"
# Crates that would violate an architectural rule wherever they appeared.
deny = [
    { name = "openssl", reason = "use rustls; no system OpenSSL dependency" },
    { name = "openssl-sys", reason = "use rustls; no system OpenSSL dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No git dependencies. A git dependency is a supply-chain edge with no registry
# audit trail and no yank mechanism.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
