# Configuration for lints that need thresholds or lists. The deny/warn levels
# themselves live in `[workspace.lints]` in Cargo.toml so they also apply to
# `cargo build`.

msrv = "1.93"

# ARCHITECTURE §4.7: nothing reads the clock or the OS entropy pool directly.
# Time and randomness enter through the `Clock` and `Rng` traits so that sealing,
# salting, cutoff windows, and holdout selection are deterministic under test.
#
# The composition root (`ghostr-engine`) is the one place that constructs the
# real implementations; it does so behind an explicit
# `#[allow(clippy::disallowed_methods)]` carrying a comment, which makes every
# exception greppable.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "use the Clock trait (ARCHITECTURE 4.7)" },
    { path = "std::time::Instant::now", reason = "use the Clock trait (ARCHITECTURE 4.7)" },
    # `allow-invalid` because these two do not currently resolve: chrono is built
    # without its `clock` feature, so they do not exist in the tree at all. The
    # entries stay as a second line of defence for the day someone enables the
    # feature for an unrelated reason.
    { path = "chrono::Utc::now", reason = "use the Clock trait (ARCHITECTURE 4.7)", allow-invalid = true },
    { path = "chrono::Local::now", reason = "use the Clock trait (ARCHITECTURE 4.7)", allow-invalid = true },
]

# SPEC I8 / THREAT_MODEL T1: byte-slice types that have carried key material must
# not gain a Debug rendering by accident.
disallowed-macros = []

# Domain types are small and copy-cheap; the default 8-byte trivial-copy limit
# produces noise on Hash32 and the id newtypes.
trivial-copy-size-limit = 32
